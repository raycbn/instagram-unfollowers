<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <meta
    name="description"
    content="Gestiona tus seguidores y seguidos de Instagram"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css?v=20260817"
  >

  <title>Instagram Unfollowers</title>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="logo">
        👤
      </div>

      <h1>
        Instagram Unfollowers
      </h1>

      <p>
        Descubre quién no te sigue de vuelta.
      </p>

    </header>


    <!-- SUBIR ZIP -->

    <section class="card">

      <div class="big-icon">
        📦
      </div>

      <h2>
        Cargar datos de Instagram
      </h2>

      <p class="description">
        Selecciona el ZIP que descargaste
        desde Instagram.
      </p>

      <label class="upload-button">

        📂 Seleccionar ZIP

        <input
          id="zipInput"
          type="file"
          accept=".zip,application/zip"
        >

      </label>

      <div
        id="status"
        class="status"
      >
      </div>

    </section>


    <!-- ESTADÍSTICAS -->

    <section
      id="stats"
      class="stats hidden"
    >

      <div class="stat-card">

        <strong id="followersCount">
          0
        </strong>

        <span>
          Seguidores
        </span>

      </div>


      <div class="stat-card">

        <strong id="followingCount">
          0
        </strong>

        <span>
          Siguiendo
        </span>

      </div>


      <div class="stat-card danger">

        <strong id="notFollowingCount">
          0
        </strong>

        <span>
          No te siguen
        </span>

      </div>

    </section>


    <!-- GESTOR -->

    <section
      id="manager"
      class="card hidden"
    >

      <div class="manager-header">

        <div>

          <h2>
            🚫 No te siguen
          </h2>

          <p id="batchInfo">
            Lote 1
          </p>

        </div>

        <div class="batch-number">

          <strong id="batchNumber">
            1
          </strong>

          <span>
            /
            <span id="totalBatches">
              1
            </span>
          </span>

        </div>

      </div>


      <!-- PROGRESO -->

      <div class="progress-area">

        <div class="progress-track">

          <div
            id="progressBar"
            class="progress-fill"
          >
          </div>

        </div>

        <div
          id="progressText"
          class="progress-text"
        >
          0 / 100 procesados
        </div>

      </div>


      <!-- BUSCAR -->

      <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Buscar usuario..."
      >


      <!-- ACCIONES -->

      <div class="actions">

        <button
          id="selectAll"
          class="secondary-button"
        >
          Marcar lote completo
        </button>

        <button
          id="clearAll"
          class="secondary-button"
        >
          Desmarcar lote
        </button>

      </div>


      <!-- LISTA -->

      <div
        id="userList"
        class="user-list"
      >
      </div>


      <!-- NAVEGACIÓN -->

      <div class="navigation">

        <button
          id="previousBatch"
          class="secondary-button"
        >
          ← Anterior
        </button>

        <button
          id="nextBatch"
          class="primary-button"
        >
          Siguiente →
        </button>

      </div>


      <button
        id="resetProgress"
        class="reset-button"
      >
        🗑️ Reiniciar progreso
      </button>

    </section>


    <!-- DIAGNÓSTICO -->

    <section
      id="debug"
      class="debug hidden"
    >

      <h3>
        🔧 Diagnóstico
      </h3>

      <div id="debugContent">
      </div>

    </section>

  </main>


  <!--
    JSZip
  -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
  ></script>


  <!--
    IMPORTANTE:
    versión nueva para evitar caché
  -->

  <script src="app.js?v=20260817"></script>


  <!--
    Elimina cualquier Service Worker antiguo
    que haya quedado instalado.
  -->

  <script>

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .getRegistrations()
        .then(function(registrations) {

          registrations.forEach(function(registration) {

            registration.unregister();

          });

        });

      if ("caches" in window) {

        caches.keys()
          .then(function(names) {

            names.forEach(function(name) {

              caches.delete(name);

            });

          });

      }

    }

  </script>

</body>

</html>
